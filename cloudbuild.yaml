# Cloud Build pipeline for AnchorCorps Site Builder (Phase 1, Task 1.8).
#
# Triggered by a push to `main` (configure the trigger in Cloud Build UI or
# via `gcloud builds triggers create github ...` — see docs/deploy.md).
#
# Substitutions you MUST set on the trigger (or in `gcloud builds submit`
# with --substitutions):
#   _REGION         e.g. us-central1
#   _SERVICE        e.g. anchor-sites
#   _AR_REPO        Artifact Registry repo name (e.g. anchor)
#   _SQL_INSTANCE   full Cloud SQL instance connection name
#                   ($PROJECT_ID:$_REGION:<instance-name>)
#
# Secrets must exist in Secret Manager BEFORE the first deploy:
#   DATABASE_URL          — postgres URL using the Cloud SQL Unix socket
#                            (postgres:///anchor_dev?host=/cloudsql/$_SQL_INSTANCE)
#   ADMIN_API_TOKEN       — opaque string; the editor / curl uses it via
#                            the X-Admin-Token header
#   RESEND_API_KEY        — Phase 1 Task 1.9 wires this; placeholder OK until then

substitutions:
  _REGION: us-central1
  _SERVICE: anchor-sites
  _AR_REPO: anchor
  _SQL_INSTANCE: PROJECT_ID:us-central1:anchor-postgres
  _IMAGE: ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA

steps:
  # 1. Build the image.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_IMAGE}
      - --cache-from=${_IMAGE%:*}:cache
      - --file=Dockerfile
      - .

  # 2. Push.
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, "${_IMAGE}"]

  # 3. Run DB migrations as a one-off job before swapping traffic.
  #    Reads DATABASE_URL from Secret Manager via Cloud Run Job (migrate
  #    job is created out-of-band in docs/deploy.md). The build step just
  #    triggers it and waits for completion.
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - ${_SERVICE}-migrate
      - --region=${_REGION}
      - --wait

  # 4. Deploy the new revision.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      - --set-env-vars=NODE_ENV=production
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,ADMIN_API_TOKEN=ADMIN_API_TOKEN:latest,RESEND_API_KEY=RESEND_API_KEY:latest
      - --min-instances=0
      - --max-instances=10
      - --cpu=1
      - --memory=512Mi
      - --timeout=60s
      - --concurrency=80

images:
  - ${_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
