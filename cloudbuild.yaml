# Cloud Build pipeline for AnchorCorps Site Builder (Phase 1, Task 1.8).
#
# Triggered by a push to `main` (configure the trigger in Cloud Build UI or
# via `gcloud builds triggers create github ...` — see docs/deploy.md).
#
# Substitutions you MUST set on the trigger (or in `gcloud builds submit`
# with --substitutions):
#   _REGION         e.g. us-central1
#   _SERVICE        e.g. anchor-sites
#   _AR_REPO        Artifact Registry repo name (e.g. anchor)
#   _SQL_INSTANCE   full Cloud SQL instance connection name
#                   ($PROJECT_ID:$_REGION:<instance-name>)
#
# Secrets must exist in Secret Manager BEFORE the first deploy:
#   ANCHOR_SITES_DATABASE_URL    — postgres URL using the Cloud SQL Unix
#                                   socket (postgres:///anchor_sites_prod?host=/cloudsql/$_SQL_INSTANCE)
#                                   Scoped to the new anchor_sites DB user so
#                                   anchor-hub's DATABASE_URL stays isolated.
#   ANCHOR_SITES_ADMIN_API_TOKEN  — opaque string; the editor / curl uses it
#                                   via the X-Admin-Token header.
#   MAILGUN_API_KEY               — shared with anchor-hub (D-023).
#   MAILGUN_DOMAIN                — shared with anchor-hub.
#   MAILGUN_DEFAULT_FROM          — shared with anchor-hub.
#   GOOGLE_CLIENT_ID              — Studio Google OAuth web client (D-034).
#   GOOGLE_CLIENT_SECRET          — Studio Google OAuth secret.
#   BETTER_AUTH_SECRET            — 32+ random bytes; Studio session signing.
#   GODADDY_API_KEY               — GoDaddy DNS API key (DnsProvider, shared
#                                   project-wide across the Cloud Run services).
#   GODADDY_API_SECRET            — GoDaddy DNS API secret.
#   GITHUB_CONTENT_TOKEN          — GitHub sync (docs/github-sync.md). Created
#                                   with placeholder value "disabled" (Task 8)
#                                   so resolveGitMode() stays "disabled" and
#                                   deploys stay green until the operator adds
#                                   a real fine-grained PAT (Contents R/W on
#                                   the content repo).
#   GITHUB_WEBHOOK_SECRET         — GitHub sync push-webhook HMAC secret.
#                                   Same placeholder-value convention as above.

substitutions:
  _REGION: us-central1
  _SERVICE: anchor-sites
  _AR_REPO: cloud-run-source-deploy
  _SQL_INSTANCE: anchor-hub-480305:us-central1:anchor
  # NOTE: don't reintroduce an `_IMAGE` substitution composed from $PROJECT_ID /
  # $SHORT_SHA — Cloud Build does NOT recursively expand built-ins nested inside
  # another substitution's value, so the image name shipped literal "$SHORT_SHA"
  # and the build failed validation (2026-05-20). Built-ins must be used inline.

steps:
  # 1. Build the image.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - --file=Dockerfile
      - .

  # 2. Push.
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA"]

  # 3a. Point the migrate job at the freshly-built image FIRST, otherwise
  #     `jobs execute` would run the migration files baked into whatever
  #     image the job last used (stale). Without this step a deploy can
  #     ship code expecting columns its migration step never created.
  #     Also (re)assert the job command = `npm run deploy:db` so the job runs
  #     migrate:up THEN db:seed-templates (idempotent built-in "Starter"
  #     template — scoped to the `starter` slug, never recreates demo sites or
  #     touches user templates). Set here so it's config-as-code and survives
  #     the job ever being recreated — no manual `gcloud` step, like migrations.
  - id: migrate-image
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - ${_SERVICE}-migrate
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --command=npm
      - --args=run,deploy:db

  # 3b. Run DB migrations + seed built-in templates as a one-off job before
  #     swapping traffic. Reads DATABASE_URL from Secret Manager via the Cloud
  #     Run Job (created out-of-band in docs/deploy.md). Executes `npm run
  #     deploy:db` (migrate:up && db:seed-templates) per the command set in 3a.
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - ${_SERVICE}-migrate
      - --region=${_REGION}
      - --wait

  # 4. Deploy the new revision.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      # GITHUB_CONTENT_REPO ("owner/repo"; empty = git sync disabled — see
      # resolveGitMode() in src/server/git/client.ts) joins --set-env-vars
      # (not --set-secrets) since it's not sensitive, just config. Left empty
      # here on purpose: the operator sets a real value only once the content
      # repo + PAT + webhook secret from docs/github-sync.md's runbook exist.
      # GCP_PROJECT_ID: required by the Phase-10 domain-provisioning client
      # (src/server/gcloud/run-domains.ts). --set-env-vars REPLACES the whole
      # env list per deploy (same gotcha as --set-secrets below), so it must
      # live here — a manual `gcloud run services update` lapses on next CI
      # deploy (this broke provisioning for tmj-new-england, 2026-07-28).
      - --set-env-vars=NODE_ENV=production,GITHUB_CONTENT_REPO=jmartin-anchorcorps/anchor-sites-content,GCP_PROJECT_ID=anchor-hub-480305
      # NOTE: --set-secrets REPLACES the service's entire secret list on every
      # deploy. Any secret NOT listed here is dropped from the next revision —
      # so OAuth (Studio Google sign-in) and GoDaddy DNS MUST be listed here, or
      # a CI deploy silently disables them. Keep this in sync with Secret Manager.
      - --set-secrets=DATABASE_URL=ANCHOR_SITES_DATABASE_URL:latest,ADMIN_API_TOKEN=ANCHOR_SITES_ADMIN_API_TOKEN:latest,MAILGUN_API_KEY=MAILGUN_API_KEY:latest,MAILGUN_DOMAIN=MAILGUN_DOMAIN:latest,MAILGUN_DEFAULT_FROM=MAILGUN_DEFAULT_FROM:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,BETTER_AUTH_SECRET=BETTER_AUTH_SECRET:latest,GODADDY_API_KEY=GODADDY_API_KEY:latest,GODADDY_API_SECRET=GODADDY_API_SECRET:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,PIXABAY_API_KEY=PIXABAY_API_KEY:latest,PLUGIN_CONFIG_ENC_KEY=PLUGIN_CONFIG_ENC_KEY:latest,GITHUB_CONTENT_TOKEN=GITHUB_CONTENT_TOKEN:latest,GITHUB_WEBHOOK_SECRET=GITHUB_WEBHOOK_SECRET:latest
      - --min-instances=0
      - --max-instances=10
      - --cpu=1
      - --memory=512Mi
      - --timeout=60s
      - --concurrency=80
      # Agent turns run as in-process pg-boss background jobs (Phase A,
      # 2026-07-30). With default request-scoped CPU, an instance with no
      # in-flight request gets throttled to near-zero — DB keepalives and
      # Anthropic calls time out mid-build (observed: continuation round
      # errored, pg-boss "Connection terminated" storms). Always-allocated
      # CPU keeps background turns alive when no tab is watching.
      - --no-cpu-throttling

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
