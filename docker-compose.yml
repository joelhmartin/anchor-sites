services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anchor
      POSTGRES_PASSWORD: anchor
      POSTGRES_DB: anchor_dev
    ports:
      # Host port 5434 to coexist with other local Postgres instances
      # (5432 system Postgres, 5433 anchor_db from another project).
      - "5434:5432"
    volumes:
      - anchor_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anchor -d anchor_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  anchor_pg_data:
